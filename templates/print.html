<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ఓటరు కార్డు – {{ voter.serial_no }}</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #f3f6f3; color: #172117; font-family: "Noto Sans Telugu", "Nirmala UI", sans-serif; }
        .page { max-width: 1100px; margin: 24px auto; padding: 28px; background: #fff; border: 1px solid #d1ddd1; }
        .actions { display: flex; gap: 10px; margin-bottom: 22px; }
        button, a { border: 0; border-radius: 6px; padding: 10px 16px; font: inherit; cursor: pointer; text-decoration: none; }
        button { background: #1b6e2b; color: #fff; }
        a { background: #e7efe7; color: #173b1d; }
        .voter-card { display: flex; justify-content: center; }
        .voter-card img { width: 100%; max-width: 1050px; height: auto; border: 1px solid #999; image-rendering: auto; }
        @media (max-width: 600px) { .page { margin: 0; border: 0; padding: 16px; } }
        @media print { body { background: #fff; } .page { max-width: none; margin: 0; border: 0; padding: 0; } .actions { display: none; } }
    </style>
</head>
<body>
    <main class="page">
        <div class="actions">
            <button type="button" onclick="window.print()">🖨️ ప్రింట్ చేయండి</button>
            <a href="/">← శోధనకు తిరిగి వెళ్ళండి</a>
        </div>
        <div class="voter-card">
            <img src="/preview/{{ voter.serial_no }}" alt="ఓటరు వరుస సంఖ్య {{ voter.serial_no }} అసలు నమోదు ప్రతి">
        </div>
    </main>
</body>
</html>
